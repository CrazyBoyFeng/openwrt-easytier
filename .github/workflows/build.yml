name: Build Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release:
        description: 'Release tag name (leave empty to skip release)'
        required: false
        type: string
        default: ''

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 'x86/64'
            slug: 'x86-64'
            rust_target: 'x86_64-unknown-linux-musl'
          - target: 'mediatek/filogic'
            slug: 'mediatek-filogic'
            rust_target: 'aarch64-unknown-linux-musl'
          - target: 'ramips/mt7621'
            slug: 'ramips-mt7621'
            rust_target: 'mipsel-unknown-linux-musl'
            build_std: true
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TERM: xterm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust via rustup
        run: |
          if [ "${{ matrix.build_std }}" = "true" ]; then
            # Nightly + rust-src for -Zbuild-std (targets without prebuilt std)
            rustup default nightly
            rustup component add rust-src
            # Skip rustup target add: -Zbuild-std builds std from source,
            # and nightly no longer ships prebuilt std for tier-3 targets
            # like mipsel-unknown-linux-musl (causes "no prebuilt artifacts").
          else
            # Stable with prebuilt std
            rustup default stable
            rustup target add "${{ matrix.rust_target }}"
          fi

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang libclang-dev zstd upx-ucl

      - name: Build packages
        timeout-minutes: 330
        run: |
          SLUG="${{ matrix.slug }}"
          WORKSPACE="$GITHUB_WORKSPACE"

          # Directory to persist prebuilt binaries across SDK builds.
          # The first SDK compiles Rust; the second SDK reuses these binaries
          # to skip the ~40 min cargo build, cutting wall-clock time nearly in half.
          PREBUILT_DIR="$WORKSPACE/.prebuilt"

          build_sdk() {
            local SDK_VER="$1"
            local PKG_FMT="$2"
            local TAR_EXT="$3"
            local USE_PREBUILT="$4"

            echo "=== Downloading $SDK_VER SDK ($PKG_FMT) ==="
            local INDEX FILE PAT
            if [ "$SDK_VER" = "snapshot" ]; then
              INDEX="https://downloads.openwrt.org/snapshots/targets/${{ matrix.target }}/"
            else
              INDEX="https://downloads.openwrt.org/releases/$SDK_VER/targets/${{ matrix.target }}/"
            fi

            FILE=$(curl -sL "$INDEX" | grep -oE "openwrt-sdk-[0-9a-zA-Z._-]+-${SLUG}[0-9a-zA-Z._-]*\.tar\.${TAR_EXT}" | head -1)
            if [ -z "$FILE" ]; then
              echo "ERROR: SDK file not found for $SDK_VER"
              return 1
            fi
            local DIR="${FILE%.tar.*}"

            curl -L "${INDEX}${FILE}" -o "sdk.tar.${TAR_EXT}"
            if [ "$TAR_EXT" = "zst" ]; then
              tar --zstd -xf "sdk.tar.${TAR_EXT}"
            else
              tar xJf "sdk.tar.${TAR_EXT}"
            fi
            rm "sdk.tar.${TAR_EXT}"

            cd "$DIR"

            echo "=== Configuring $SDK_VER build ==="
            ./scripts/feeds update -a
            # Do NOT use 'feeds install -a'.  That makes ALL feed packages
            # available, causing make defconfig to enable hundreds of
            # unrelated packages (firmware, kernel modules, etc.) by
            # default and build them — wasting CI time.  We only need
            # our custom package (copied below) and base SDK packages
            # (kernel, kmod-tun).  rust-package.mk is included via
            # direct path and does not require feeds install.

            # Copy package source
            mkdir -p package/easytier
            cp -r "$WORKSPACE/Makefile" "$WORKSPACE/patches" "$WORKSPACE/files" package/easytier/

            # Use pre-installed rustup toolchain and system protoc instead of
            # building rust/host and protobuf/host from source (much faster).
            sed -i 's|rust/host protobuf/host||' package/easytier/Makefile
            sed -i 's|PROTOC=\$(STAGING_DIR_HOSTPKG)/bin/protoc|PROTOC=/usr/bin/protoc|' package/easytier/Makefile

            # SDK builds: BINDGEN needs cross-compilation target headers from the
            # TOOLCHAIN staging dir.  -nostdinc prevents clang from searching
            # the host /usr/include (glibc conflicts with musl cross target).
            # We need two include dirs from the toolchain:
            #   1. toolchain-*/include  — GCC wrapper layer (stddef.h, stdint.h, etc.)
            #   2. toolchain-*/usr/include — musl libc headers
            # IMPORTANT: Must use ABSOLUTE paths because cargo build scripts
            # (e.g. kcp-sys) run in target/release/build/<crate-hash>/, NOT in
            # the SDK root.  Relative paths would fail to resolve.
            TOOLCHAIN_DIR=$(ls -d staging_dir/toolchain-* 2>/dev/null | head -1)
            if [ -n "$TOOLCHAIN_DIR" ]; then
              TOOLCHAIN_DIR="$(cd "$TOOLCHAIN_DIR" && pwd)"
              echo "Overriding BINDGEN_EXTRA_CLANG_ARGS with toolchain includes: $TOOLCHAIN_DIR"
              sed -i "s|BINDGEN_EXTRA_CLANG_ARGS=.*|BINDGEN_EXTRA_CLANG_ARGS=\"-nostdinc -I${TOOLCHAIN_DIR}/include -I${TOOLCHAIN_DIR}/usr/include\"|" package/easytier/Makefile
            else
              echo "WARNING: toolchain dir not found, bindgen may fail on cross-compile targets"
            fi

            if [ "$USE_PREBUILT" = "1" ] && [ -d "$PREBUILT_DIR" ] && [ "$(ls -A "$PREBUILT_DIR")" ]; then
              echo "=== Using prebuilt binaries (skipping cargo build) ==="
              # Replace Build/Compile with per-variant binary copy.
              # $(or $(BUILD_VARIANT),full) handles the default variant.
              # sed c\ replaces the entire line; the original line may
              # contain UPX (appended via &&), which is discarded here.
              sed -i '\|^Build/Compile=|c\Build/Compile=mkdir -p $(PKG_INSTALL_DIR)/bin \&\& cp '"$PREBUILT_DIR"'/$(or $(BUILD_VARIANT),full)/easytier-core $(PKG_INSTALL_DIR)/bin/' package/easytier/Makefile
            else
              echo "=== Will compile Rust from source ==="
              # Replace cargo install (from Build/Compile/Cargo) with direct
              # cargo build.  This avoids needing rust/host to be compiled from
              # source (~14 GB, ~1 h).  rust-package.mk still provides the
              # cross-compilation env vars (CARGO_PKG_VARS) and target/profile
              # variables (RUSTC_TARGET_ARCH, CARGO_PKG_PROFILE).
              # Cargo profile optimizations (LTO, codegen-units, etc.) and UPX
              # are defined in Makefile; here we only override the build command.
              if [ "${{ matrix.build_std }}" = "true" ]; then
                # mipsel: build std from source via -Zbuild-std
                sed -i '\|^Build/Compile=|c\Build/Compile=$(CARGO_PKG_VARS) cargo -Z build-std build -v --manifest-path $(PKG_BUILD_DIR)/easytier/Cargo.toml -p easytier --bin easytier-core --profile $(CARGO_PKG_PROFILE) $(if $(strip $(RUST_PKG_FEATURES)),--no-default-features --features "$(strip $(RUST_PKG_FEATURES))") \&\& upx --best $(PKG_BUILD_DIR)/target/$(RUSTC_TARGET_ARCH)/$(CARGO_PKG_PROFILE)/easytier-core \&\& mkdir -p $(PKG_INSTALL_DIR)/bin \&\& cp $(PKG_BUILD_DIR)/target/$(RUSTC_TARGET_ARCH)/$(CARGO_PKG_PROFILE)/easytier-core $(PKG_INSTALL_DIR)/bin/' package/easytier/Makefile
              else
                # targets with prebuilt std: use regular cargo build
                sed -i '\|^Build/Compile=|c\Build/Compile=$(CARGO_PKG_VARS) cargo build -v --manifest-path $(PKG_BUILD_DIR)/easytier/Cargo.toml -p easytier --bin easytier-core --profile $(CARGO_PKG_PROFILE) $(if $(strip $(RUST_PKG_FEATURES)),--no-default-features --features "$(strip $(RUST_PKG_FEATURES))") \&\& upx --best $(PKG_BUILD_DIR)/target/$(RUSTC_TARGET_ARCH)/$(CARGO_PKG_PROFILE)/easytier-core \&\& mkdir -p $(PKG_INSTALL_DIR)/bin \&\& cp $(PKG_BUILD_DIR)/target/$(RUSTC_TARGET_ARCH)/$(CARGO_PKG_PROFILE)/easytier-core $(PKG_INSTALL_DIR)/bin/' package/easytier/Makefile
              fi
            fi

            # Select packages
            printf 'CONFIG_PACKAGE_easytier=y\nCONFIG_PACKAGE_easytier-lite=y\n' >> .config
            make defconfig

            echo "=== Building packages ($PKG_FMT) ==="
            # Cargo profile optimizations (LTO, codegen-units, panic, etc.)
            # are defined in Makefile via export, no need to set them here.
            make package/easytier/compile V=s || make package/easytier/compile V=s
            make package/easytier-lite/compile V=s || make package/easytier-lite/compile V=s

            # Collect artifacts — only easytier packages.
            # Match by package NAME, not extension — SDKs may produce
            # .ipk or .apk depending on version.
            mkdir -p "$WORKSPACE/output/$SDK_VER"
            find bin/packages bin/targets -name 'easytier*' -exec cp {} "$WORKSPACE/output/$SDK_VER/" \;

            # Save prebuilt binaries for the next SDK build (if this was
            # a from-source build).  Save per-variant since full and lite
            # produce different binaries after the --no-default-features fix.
            if [ "$USE_PREBUILT" != "1" ]; then
              mkdir -p "$PREBUILT_DIR/full" "$PREBUILT_DIR/lite"
              for d in $(find build_dir/target-* -maxdepth 2 -type d -name 'easytier*'); do
                bin=$(find "$d/target" -name "easytier-core" -type f 2>/dev/null | head -1)
                if [ -n "$bin" ]; then
                  case "$(basename "$d")" in
                    easytier-lite-*) variant="lite" ;;
                    *) variant="full" ;;
                  esac
                  cp "$bin" "$PREBUILT_DIR/$variant/"
                  echo "Saved prebuilt $variant binary: $(ls -lh "$PREBUILT_DIR/$variant/easytier-core" | awk '{print $5}')"
                fi
              done
            fi

            cd ..
            rm -rf "$DIR"
            echo "=== $SDK_VER ($PKG_FMT) done ==="
          }

          # First SDK: compile Rust from source
          build_sdk "23.05.6" "ipk" "xz" ""
          # Second SDK: reuse prebuilt binaries, skip cargo build
          build_sdk "25.12.4" "apk" "zst" "1"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easytier-${{ matrix.slug }}
          path: output/
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.release != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          name: ${{ inputs.release || github.ref_name }}
          files: release-artifacts/**
          generate_release_notes: true
