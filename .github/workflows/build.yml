name: Build Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release:
        description: 'Release tag name (leave empty to skip release)'
        required: false
        type: string
        default: ''

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 'x86/64'
            slug: 'x86-64'
            rust_target: 'x86_64-unknown-linux-musl'
          - target: 'mediatek/filogic'
            slug: 'mediatek-filogic'
            rust_target: 'aarch64-unknown-linux-musl'
          - target: 'ramips/mt7621'
            slug: 'ramips-mt7621'
            rust_target: 'mipsel-unknown-linux-musl'
            build_std: true
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TERM: xterm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust via rustup
        run: |
          if [ "${{ matrix.build_std }}" = "true" ]; then
            # Nightly + rust-src for -Zbuild-std (targets without prebuilt std)
            rustup default nightly
            rustup component add rust-src
            # Skip rustup target add: -Zbuild-std builds std from source,
            # and nightly no longer ships prebuilt std for tier-3 targets
            # like mipsel-unknown-linux-musl (causes "no prebuilt artifacts").
          else
            # Stable with prebuilt std
            rustup default stable
            rustup target add "${{ matrix.rust_target }}"
          fi

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang libclang-dev

      - name: Build packages
        timeout-minutes: 330
        run: |
          SLUG="${{ matrix.slug }}"
          WORKSPACE="$GITHUB_WORKSPACE"

          build_sdk() {
            local SDK_VER="$1"
            local PKG_FMT="$2"
            local TAR_EXT="$3"

            echo "=== Downloading $SDK_VER SDK ($PKG_FMT) ==="
            local INDEX="https://downloads.openwrt.org/releases/$SDK_VER/targets/${{ matrix.target }}/"
            local FILE
            FILE=$(curl -sL "$INDEX" | grep -o "openwrt-sdk-$SDK_VER-${SLUG}[^\"']*\.tar\.${TAR_EXT}" | head -1)
            if [ -z "$FILE" ]; then
              echo "ERROR: SDK file not found for $SDK_VER"
              return 1
            fi
            local DIR="${FILE%.tar.*}"

            curl -L "${INDEX}${FILE}" -o "sdk.tar.${TAR_EXT}"
            if [ "$TAR_EXT" = "zst" ]; then
              tar --zstd -xf "sdk.tar.${TAR_EXT}"
            else
              tar xJf "sdk.tar.${TAR_EXT}"
            fi
            rm "sdk.tar.${TAR_EXT}"

            cd "$DIR"

            echo "=== Configuring $SDK_VER build ==="
            ./scripts/feeds update -a
            ./scripts/feeds install -a

            # Copy package source
            mkdir -p package/easytier
            cp -r "$WORKSPACE/Makefile" "$WORKSPACE/patches" "$WORKSPACE/files" package/easytier/

            # Use pre-installed rustup toolchain and system protoc instead of
            # building rust/host and protobuf/host from source (much faster).
            # NOTE: no trailing space in the sed pattern — the Makefile line
            # ends with "protobuf/host" followed by a newline, not a space.
            sed -i 's/rust\/host protobuf\/host//' package/easytier/Makefile
            sed -i 's|PROTOC=\$(STAGING_DIR_HOSTPKG)/bin/protoc|PROTOC=/usr/bin/protoc|' package/easytier/Makefile

            # Replace cargo install (from Build/Compile/Cargo) with direct
            # cargo build.  This avoids needing rust/host to be compiled from
            # source (~14 GB, ~1 h).  rust-package.mk still provides the
            # cross-compilation env vars (CARGO_PKG_VARS) and target/profile
            # variables (RUSTC_TARGET_ARCH, CARGO_PKG_PROFILE).
            if [ "${{ matrix.build_std }}" = "true" ]; then
              # mipsel: build std from source via -Zbuild-std
              sed -i 's|Build/Compile=\$(call Build/Compile/Cargo,easytier)|Build/Compile=$(CARGO_PKG_VARS) cargo -Z build-std build -v --manifest-path $(PKG_BUILD_DIR)/easytier/Cargo.toml -p easytier --profile $(CARGO_PKG_PROFILE) $(if $(strip $(RUST_PKG_FEATURES)),--features "$(strip $(RUST_PKG_FEATURES))") $(CARGO_PKG_ARGS) \&\& mkdir -p $(PKG_INSTALL_DIR)/bin \&\& cp $(PKG_BUILD_DIR)/target/$(RUSTC_TARGET_ARCH)/$(CARGO_PKG_PROFILE)/easytier-core $(PKG_INSTALL_DIR)/bin/|' package/easytier/Makefile
            else
              # targets with prebuilt std: use regular cargo build
              sed -i 's|Build/Compile=\$(call Build/Compile/Cargo,easytier)|Build/Compile=$(CARGO_PKG_VARS) cargo build -v --manifest-path $(PKG_BUILD_DIR)/easytier/Cargo.toml -p easytier --profile $(CARGO_PKG_PROFILE) $(if $(strip $(RUST_PKG_FEATURES)),--features "$(strip $(RUST_PKG_FEATURES))") $(CARGO_PKG_ARGS) \&\& mkdir -p $(PKG_INSTALL_DIR)/bin \&\& cp $(PKG_BUILD_DIR)/target/$(RUSTC_TARGET_ARCH)/$(CARGO_PKG_PROFILE)/easytier-core $(PKG_INSTALL_DIR)/bin/|' package/easytier/Makefile
            fi

            # Select packages
            printf 'CONFIG_PACKAGE_easytier=y\nCONFIG_PACKAGE_easytier-lite=y\n' >> .config
            make defconfig

            echo "=== Building packages ($PKG_FMT) ==="
            make package/easytier/compile V=s || make package/easytier/compile V=s
            make package/easytier/lite/compile V=s || make package/easytier/lite/compile V=s

            # Collect artifacts
            mkdir -p "$WORKSPACE/output/$PKG_FMT"
            find bin/packages -name "*.${PKG_FMT}" -exec cp {} "$WORKSPACE/output/$PKG_FMT/" \;

            cd ..
            rm -rf "$DIR"
            echo "=== $SDK_VER ($PKG_FMT) done ==="
          }

          build_sdk "23.05.6" "ipk" "xz"
          build_sdk "24.10.6" "apk" "zst"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easytier-${{ matrix.slug }}
          path: output/
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.release != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          name: ${{ inputs.release || github.ref_name }}
          files: release-artifacts/**
          generate_release_notes: true
