name: Build Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release:
        description: 'Release tag name (leave empty to skip release)'
        required: false
        type: string
        default: ''

jobs:
  build:
    name: ${{ matrix.slug }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: 'x86-64'
          - slug: 'mediatek-filogic'
          - slug: 'ramips-mt7621'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TERM: xterm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          # Rust toolchain setup is handled by build.sh (rustup target
          # detection for tier-1/2 vs tier-3).  Only system-level
          # dependencies need sudo here.
          sudo apt-get update && sudo apt-get install -y \
            protobuf-compiler clang libclang-dev zstd
          # Install rustup if not present (GitHub runners may not have it).
          if ! command -v rustup &>/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable
            export PATH="$HOME/.cargo/bin:$PATH"
          fi

      - name: Build packages
        timeout-minutes: 330
        run: bash ./build.sh "${{ matrix.slug }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easytier-${{ matrix.slug }}
          path: output/
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.release != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          name: ${{ inputs.release || github.ref_name }}
          files: release-artifacts/**
          generate_release_notes: true
