name: Build Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.target }} / ${{ matrix.sdk }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86/64
          - mediatek/filogic
          - ramips/mt7621
        sdk:
          - '23.05.6'    # ipk
          - '24.10.0'    # apk
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TERM: xterm
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: 2G

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare environment variables
        id: prep
        run: |
          slug=$(echo "${{ matrix.target }}" | tr '/' '-')
          echo "slug=${slug}" >> "$GITHUB_OUTPUT"

          if [[ "${{ matrix.sdk }}" == 23.* ]]; then
            echo "pkg_fmt=ipk" >> "$GITHUB_OUTPUT"
            echo "sdk_ext=xz" >> "$GITHUB_OUTPUT"
            sdk_ext="xz"
          else
            echo "pkg_fmt=apk" >> "$GITHUB_OUTPUT"
            echo "sdk_ext=zst" >> "$GITHUB_OUTPUT"
            sdk_ext="zst"
          fi

          # Discover the actual SDK filename from the download index
          index_url="https://downloads.openwrt.org/releases/${{ matrix.sdk }}/targets/${{ matrix.target }}/"
          sdk_file=$(curl -sL "$index_url" | grep -o "openwrt-sdk-${{ matrix.sdk }}-${slug}[^\"']*\.tar\.${sdk_ext}" | head -1)
          echo "sdk_file=${sdk_file}" >> "$GITHUB_OUTPUT"
          # SDK directory name is the filename without the tar extension
          sdk_dir="${sdk_file%.tar.*}"
          echo "sdk_dir=${sdk_dir}" >> "$GITHUB_OUTPUT"

      - name: Download and extract SDK
        run: |
          if [ ! -d "${{ steps.prep.outputs.sdk_dir }}" ]; then
            echo "::group::Downloading SDK"
            curl -L \
              "https://downloads.openwrt.org/releases/${{ matrix.sdk }}/targets/${{ matrix.target }}/${{ steps.prep.outputs.sdk_file }}" \
              -o sdk.tar.${{ steps.prep.outputs.sdk_ext }}
            echo "::endgroup::"
            echo "::group::Extracting SDK"
            if [ "${{ steps.prep.outputs.sdk_ext }}" = "zst" ]; then
              tar --zstd -xf sdk.tar.${{ steps.prep.outputs.sdk_ext }}
            else
              tar xJf sdk.tar.${{ steps.prep.outputs.sdk_ext }}
            fi
            rm sdk.tar.${{ steps.prep.outputs.sdk_ext }}
            echo "::endgroup::"
          fi

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Cache toolchain and downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.prep.outputs.sdk_dir }}/dl
            ${{ steps.prep.outputs.sdk_dir }}/staging_dir
          key: >-
            build-${{ matrix.sdk }}-${{ steps.prep.outputs.slug }}-${{ hashFiles('Makefile', 'patches/**') }}
          restore-keys: |
            build-${{ matrix.sdk }}-${{ steps.prep.outputs.slug }}-

      - name: Update feeds and install Rust
        working-directory: ${{ steps.prep.outputs.sdk_dir }}
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install rust

      - name: Copy package into SDK
        run: |
          mkdir -p "${{ steps.prep.outputs.sdk_dir }}/package/easytier"
          cp -r Makefile patches files "${{ steps.prep.outputs.sdk_dir }}/package/easytier/"

      - name: Build full variant
        working-directory: ${{ steps.prep.outputs.sdk_dir }}
        timeout-minutes: 300
        run: |
          make "package/easytier/compile" V=s || make "package/easytier/compile" V=s

      - name: Build lite variant
        working-directory: ${{ steps.prep.outputs.sdk_dir }}
        timeout-minutes: 300
        run: |
          make "package/easytier-lite/compile" V=s || make "package/easytier-lite/compile" V=s

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: >-
            easytier-${{ steps.prep.outputs.slug }}-${{ steps.prep.outputs.pkg_fmt }}
          path: >-
            ${{ steps.prep.outputs.sdk_dir }}/bin/packages/**/*.${{ steps.prep.outputs.pkg_fmt }}
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**
          generate_release_notes: true
