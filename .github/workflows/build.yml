name: Build Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release:
        description: 'Release tag name (leave empty to skip release)'
        required: false
        type: string
        default: ''
      force-rebuild:
        description: 'Force rebuild even if cached (true/false)'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: ${{ matrix.slug }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: 'x86-64'
          - slug: 'mediatek-filogic'
          - slug: 'ramips-mt7621'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TERM: xterm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tab indentation
        run: |
          FAIL=0
          for f in Makefile Makefile.legacy; do
            if [ -f "$f" ]; then
              BAD=$(grep -nP '^ {8}' "$f" | grep -vP '^\d+:\t' || true)
              if [ -n "$BAD" ]; then
                echo "::error file=$f::8-space indentation detected (should use TAB):"
                echo "$BAD" | head -5
                FAIL=1
              fi
            fi
          done
          exit $FAIL

      - name: Check build cache
        id: cache
        uses: actions/cache@v4
        with:
          path: output/
          key: build-${{ github.sha }}-${{ matrix.slug }}
          lookup-only: true

      - name: Restore cached output
        if: steps.cache.outputs.cache-hit == 'true' && inputs.force-rebuild != true
        run: |
          echo "✅ Cache hit for commit ${{ github.sha }} (${{ matrix.slug }}) — skipping build"
          # Create dummy output so artifact upload succeeds
          mkdir -p output
          touch output/.cached

      - name: Install prerequisites
        if: steps.cache.outputs.cache-hit != 'true' || inputs.force-rebuild == true
        run: |
          sudo apt-get update && sudo apt-get install -y \
            protobuf-compiler clang libclang-dev zstd
          if ! command -v rustup &>/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable
            export PATH="$HOME/.cargo/bin:$PATH"
          fi

      - name: Build packages
        if: steps.cache.outputs.cache-hit != 'true' || inputs.force-rebuild == true
        timeout-minutes: 330
        run: bash ./build.sh "${{ matrix.slug }}"

      - name: Save build cache
        if: steps.cache.outputs.cache-hit != 'true' || inputs.force-rebuild == true
        uses: actions/cache/save@v4
        with:
          path: output/
          key: build-${{ github.sha }}-${{ matrix.slug }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easytier-${{ matrix.slug }}
          path: output/
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.release != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          name: ${{ inputs.release || github.ref_name }}
          files: release-artifacts/**
          generate_release_notes: true
