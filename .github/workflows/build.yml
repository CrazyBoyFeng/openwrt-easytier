name: Build Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 'x86/64'
            slug: 'x86-64'
            cargo_target: 'x86_64-unknown-linux-gnu'
          - target: 'mediatek/filogic'
            slug: 'mediatek-filogic'
            cargo_target: 'aarch64-unknown-linux-gnu'
          - target: 'ramips/mt7621'
            slug: 'ramips-mt7621'
            cargo_target: 'mipsel-unknown-linux-gnu'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TERM: xterm
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: 2G

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust via rustup
        run: |
          rustup default stable
          rustup target add ${{ matrix.cargo_target }}

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Build packages
        timeout-minutes: 330
        run: |
          SLUG="${{ matrix.slug }}"
          CARGO_TARGET="${{ matrix.cargo_target }}"
          WORKSPACE="$GITHUB_WORKSPACE"

          build_sdk() {
            local SDK_VER="$1"
            local PKG_FMT="$2"
            local TAR_EXT="$3"

            echo "=== Downloading $SDK_VER SDK ($PKG_FMT) ==="
            local INDEX="https://downloads.openwrt.org/releases/$SDK_VER/targets/${{ matrix.target }}/"
            local FILE
            FILE=$(curl -sL "$INDEX" | grep -o "openwrt-sdk-$SDK_VER-${SLUG}[^\"']*\.tar\.${TAR_EXT}" | head -1)
            if [ -z "$FILE" ]; then
              echo "ERROR: SDK file not found for $SDK_VER"
              return 1
            fi
            local DIR="${FILE%.tar.*}"

            curl -L "${INDEX}${FILE}" -o "sdk.tar.${TAR_EXT}"
            if [ "$TAR_EXT" = "zst" ]; then
              tar --zstd -xf "sdk.tar.${TAR_EXT}"
            else
              tar xJf "sdk.tar.${TAR_EXT}"
            fi
            rm "sdk.tar.${TAR_EXT}"

            cd "$DIR"

            echo "=== Configuring $SDK_VER build ==="
            ./scripts/feeds update -a

            # Copy package source
            mkdir -p package/easytier
            cp -r "$WORKSPACE/Makefile" "$WORKSPACE/patches" "$WORKSPACE/files" package/easytier/

            # Remove rust/host build dependency — CI uses rustup instead
            sed -i '/^PKG_BUILD_DEPENDS:=rust\/host$/d' package/easytier/Makefile

            # Configure cargo cross-compiler linker (non-native targets only)
            if [ "$CARGO_TARGET" != "x86_64-unknown-linux-gnu" ]; then
              local LINKER
              LINKER=$(find staging_dir/toolchain* -name '*-gcc' -type f | head -1)
              if [ -n "$LINKER" ]; then
                mkdir -p "$HOME/.cargo"
                printf '[target.%s]\nlinker = "%s"\n' "$CARGO_TARGET" "$LINKER" > "$HOME/.cargo/config.toml"
                echo "Cargo linker: $LINKER"
              fi
            fi

            # Select packages
            printf 'CONFIG_PACKAGE_easytier=y\nCONFIG_PACKAGE_easytier-lite=y\n' >> .config
            make defconfig

            echo "=== Building full variant ($PKG_FMT) ==="
            make package/easytier/compile V=s || make package/easytier/compile V=s

            echo "=== Building lite variant ($PKG_FMT) ==="
            make package/easytier-lite/compile V=s || make package/easytier-lite/compile V=s

            # Collect artifacts
            mkdir -p "$WORKSPACE/output/$PKG_FMT"
            find bin/packages -name "*.${PKG_FMT}" -exec cp {} "$WORKSPACE/output/$PKG_FMT/" \;

            cd ..
            rm -rf "$DIR"
            echo "=== $SDK_VER ($PKG_FMT) done ==="
          }

          # Build ipk first, then apk — sccache accelerates the second build
          build_sdk "23.05.6" "ipk" "xz"
          build_sdk "24.10.6" "apk" "zst"

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easytier-${{ matrix.slug }}
          path: output/
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**
          generate_release_notes: true
